name: CPU compiler checks
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            torch: "2.8.0"
          - python: "3.12"
            torch: "2.8.0"
          - python: "3.12"
            torch: "latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.torch == 'latest'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - if: matrix.torch != 'latest'
        run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Build distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Install wheel smoke test
        run: |
          python -m venv --system-site-packages /tmp/trainkernel-wheel
          /tmp/trainkernel-wheel/bin/python -m pip install --no-deps dist/*.whl
          /tmp/trainkernel-wheel/bin/python -c "import trainkernel; print(trainkernel.__name__)"
