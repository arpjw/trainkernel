[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trainkernel"
version = "0.1.0"
description = "Compile a complete static PyTorch training step into one CUDA kernel"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Arya Somu"}]
requires-python = ">=3.10"
dependencies = ["torch>=2.8", "ninja>=1.11"]
keywords = ["pytorch", "cuda", "compiler", "training", "gpu"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/arpjw/trainkernel"
Documentation = "https://github.com/arpjw/trainkernel#readme"
Issues = "https://github.com/arpjw/trainkernel/issues"
Source = "https://github.com/arpjw/trainkernel"

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "twine>=5"]

[tool.setuptools.packages.find]
include = ["trainkernel*"]

[tool.setuptools.package-data]
trainkernel = ["py.typed"]
